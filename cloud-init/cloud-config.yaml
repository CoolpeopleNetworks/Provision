#cloud-config
package_update: true
package_upgrade: true

ssh_pwauth: false

users:
  - default
  - name: ansible
    gecos: Ansible User
    groups: users,admin,wheel
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /usr/bin/bash
    lock_passwd: true
    ssh_import_id:
      - gh:john-terrell

packages:
  - git

ansible:
  install_method: pip
  package_name: ansible
  run_user: ansible

  galaxy:
      actions:
        - ["ansible-galaxy", "collection", "install", "community.general"]
        - ["ansible-galaxy", "install", "https://github.com/evrardjp/ansible-keepalived"]
        - ["ansible-galaxy", "install", "https://github.com/john-terrell/ansible_role_microceph.git"]
        - ["ansible-galaxy", "install", "https://github.com/john-terrell/ansible_role_microk8s.git"]
        - ["ansible-galaxy", "install", "https://github.com/john-terrell/ansible_role_netdata.git"]

  pull:
    url: "https://github.com/CoolpeopleNetworks/Provision.git"
    playbook_name: local.yml
